name: Rotate MEGA link + update Patreon post

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MEGAcmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./megacmd-xUbuntu_22.04_amd64.deb

      - name: Install Python deps
        run: |
          pip install -q playwright
          # Only download headless‑shell (much smaller)
          playwright install --only-shell chromium

      - name: Restore Patreon session
        env:
          PATREON_SESSION_JSON: ${{ secrets.PATREON_SESSION_JSON }}
        run: |
          echo "$PATREON_SESSION_JSON" > patreon.json
          python -c "import json; json.load(open('patreon.json'))"

      - name: mega-login
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"

      - name: Run rotation
        env:
          PATREON_POST_ID: ${{ secrets.PATREON_POST_ID }}
        run: python update_patreon_link.py

      - name: mega-logout
        if: always()
        run: mega-logout || true
