name: Rotate MEGA Link
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */12 * * *"
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Install MEGAcmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb -O megacmd.deb
          sudo apt-get update -y
          sudo apt-get install -y ./megacmd.deb
      - name: Run rotation
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          PATREON_SESSION_JSON: ${{ secrets.PATREON_SESSION_JSON }}
          PATREON_POST_URL: ${{ vars.PATREON_POST_URL }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          MEGA_BASE_DIR: ${{ vars.MEGA_BASE_DIR }}
          FOLDER_PREFIX: ${{ vars.FOLDER_PREFIX }}
          FOLDER_FIXED_NAME: ${{ vars.FOLDER_FIXED_NAME }}
        run: python main.py
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-failure-evidence-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: ignore
