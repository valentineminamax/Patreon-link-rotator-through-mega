name: Rotate MEGA Link

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — keep in sync with config.py ROTATE_EVERY_HOURS
  workflow_dispatch:         # lets you trigger it manually from the Actions tab too

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # hard ceiling for the whole job — nothing here should take this long
    steps:
      - uses: actions/checkout@v4

      - name: Install MEGAcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          UBUNTU_CODENAME=$(lsb_release -cs)
          wget "https://mega.nz/linux/repo/xUbuntu_$(lsb_release -rs)/amd64/megacmd-xUbuntu_$(lsb_release -rs)_amd64.deb" -O megacmd.deb
          sudo apt-get install -y ./megacmd.deb || sudo apt-get install -f -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright patchright playwright-captcha
          patchright install --with-deps chromium

      - name: Restore Patreon session
        # NOTE: previously `echo '${{ secrets.PATREON_SESSION_JSON }}' > file`.
        # That's unsafe: if the JSON contains a single-quote character
        # anywhere (a cookie value, token, URL param, etc.), it breaks out
        # of the single-quoted shell string and corrupts the file into
        # invalid JSON. Passing the secret through an env var and writing
        # it with printf avoids any shell interpretation of its contents.
        env:
          PATREON_SESSION_JSON: ${{ secrets.PATREON_SESSION_JSON }}
        run: printf '%s' "$PATREON_SESSION_JSON" > patreon_session.json

      - name: Login to MEGA
        timeout-minutes: 2   # this step has no timeout of its own in mega_rotate.py's control
        run: mega-login "${{ secrets.MEGA_EMAIL }}" "${{ secrets.MEGA_PASSWORD }}"

      - name: Run rotation
        timeout-minutes: 5   # belt-and-suspenders on top of the 120s subprocess timeouts in code
        env:
             PROXY_HOST: ${{ secrets.PROXY_HOST }}
             PROXY_PORT: ${{ secrets.PROXY_PORT }}
             PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
             PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python main.py

      - name: Upload Patreon failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patreon-failure-evidence
          path: |
            patreon_failure.png
            patreon_failure.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Logout of MEGA
        if: always()
        run: mega-logout

      - name: Stop MEGAcmd server
        if: always()
        run: mega-quit || pkill -f mega-cmd-server || true
