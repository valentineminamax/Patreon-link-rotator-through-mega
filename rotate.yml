name: Rotate MEGA Link

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — keep in sync with config.py ROTATE_EVERY_HOURS
  workflow_dispatch:         # lets you trigger it manually from the Actions tab too

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MEGAcmd
        run: |
          wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./megacmd-xUbuntu_22.04_amd64.deb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Restore Patreon session
        run: echo '${{ secrets.PATREON_SESSION_JSON }}' > patreon_session.json

      - name: Login to MEGA
        run: mega-login "${{ secrets.MEGA_EMAIL }}" "${{ secrets.MEGA_PASSWORD }}"

      - name: Run rotation
        run: python main.py

      - name: Logout of MEGA
        if: always()
        run: mega-logout
